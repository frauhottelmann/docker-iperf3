name: Docker Image CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
  schedule:
    # Weekly rebuild of edge to pick up Alpine security fixes
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/frauhottelmann/iperf3

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.5.0
      with:
        dockerfile: Dockerfile

  build:
    needs: lint
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Read iperf3 version from Dockerfile
      id: version
      run: echo "version=$(sed -n 's/^ARG IPERF3_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

    - name: Check that the git tag matches the Dockerfile version
      if: github.ref_type == 'tag'
      run: |
        tag="${GITHUB_REF_NAME#v}"
        version="${{ steps.version.outputs.version }}"
        case "${tag}" in
          "${version}"|"${version}".*|"${version}"-*) ;;
          *)
            echo "::error::Git tag ${GITHUB_REF_NAME} does not match IPERF3_VERSION=${version} in the Dockerfile"
            exit 1
            ;;
        esac

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build image for smoke test
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        load: true
        pull: true
        no-cache: ${{ github.event_name == 'schedule' }}
        tags: iperf3:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test
      run: |
        version="${{ steps.version.outputs.version }}"
        docker run --rm iperf3:test --version | tee version.txt
        grep -q "^iperf ${version}" version.txt

        # Server with the same hardening as in docker-compose.yml
        docker run -d --name smoke \
          --read-only --tmpfs /tmp --cap-drop ALL \
          --security-opt no-new-privileges:true \
          iperf3:test
        sleep 2

        # TCP and UDP test against the server
        docker run --rm --network container:smoke iperf3:test -c 127.0.0.1 -t 2
        docker run --rm --network container:smoke iperf3:test -c 127.0.0.1 -t 2 -u

        # The server must stop cleanly on SIGTERM
        docker stop --timeout 5 smoke
        test "$(docker inspect --format '{{.State.ExitCode}}' smoke)" != "137"
        docker logs smoke

    - name: Scan image for vulnerabilities
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: iperf3:test
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: '1'

    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE }}
        tags: |
          type=ref,event=pr
          type=edge,branch=master
          type=sha,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
          type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}

    - name: Build multi-arch image and push to GitHub Container Registry
      id: push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
        pull: true
        no-cache: ${{ github.event_name == 'schedule' }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate artifact attestation
      if: github.event_name != 'pull_request'
      uses: actions/attest@v4
      with:
        subject-name: ${{ env.IMAGE }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
